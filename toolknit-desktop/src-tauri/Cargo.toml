[package]
name = "karui-toolbox"
version = "1.0.0"
description = "Karui 工具箱 Desktop App"
authors = ["Mr·Fan"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "karui-toolbox"

[lib]
name = "karui_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
dirs = "5"
opener = "0.7"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_UI_Input_KeyboardAndMouse"] }
